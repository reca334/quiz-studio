async function navigate(path){
 const target=path.split('/').filter(Boolean);
 if(transport.role==='host'&&transport.room&&!(target[0]==='host'&&target[1]===transport.code)){
  if(['playing','judging'].includes(transport.room.state.status)&&!confirm('司会者画面を離れるとゲームは一時停止し、回答者との通信が切れます。移動しますか？'))return;
  await transport.close();
 }else if(transport.role&&transport.role!=='host'&&target[1]!==transport.code)await transport.close();
 if(location.hash==='#'+path)await init();else location.hash=path;
}

 if(['code','trolley'].includes(p.mode)){const count=p.mode==='code'?11:2;return `<div class="field"><label for="q-options">選択肢 <span class="muted">（${count}行、1行に1つ）</span></label><textarea id="q-options" data-qfield="options" rows="${count===11?11:3}">${esc(q.options.join('\n'))}</textarea><small>${count===11?'安全な10個＋ハズレ1個。':'1行目が左、2行目が右です。'}</small></div><div class="field"><label for="q-key">${count===11?'ハズレの番号（これを選ぶと失敗）':'正解の方向'}</label><select id="q-key" data-qfield="${count===11?'danger':'correct'}">${Array.from({length:count},(_,i)=>`<option value="${i}" ${q[count===11?'danger':'correct']===i?'selected':''}>${count===2?(i===0?'左':'右'):(i+1)+'番'}${q.options[i]?'：'+esc(q.options[i].slice(0,25)):''}</option>`).join('')}</select></div>`;}

function renderEditor(){const p=app.editor,q=p.questions[app.qIndex];mount(`<main class="container"><div class="editor-actions row between"><div class="row"><button class="small ghost" data-action="editor-back">${icon('back')} スタジオ</button><span class="pill ${app.dirty?'warn':'teal'}" id="save-status">${app.dirty?'未保存の変更あり':'編集内容を確認'}</span></div><button class="primary" data-action="save-pack">${icon('check')} 問題集を保存</button></div><div class="editor-grid"><aside class="panel question-nav"><div class="row between mb"><h3>問題一覧</h3><span class="tag">${p.questions.length}問</span></div><div class="question-nav-list">${p.questions.map((q,i)=>`<div class="question-row ${app.qIndex===i?'active':''}" role="button" tabindex="0" data-action="select-question" data-index="${i}"><span>${String(i+1).padStart(2,'0')}</span><span>${esc(q.prompt||'新しい問題')}</span></div>`).join('')}</div><button class="wide small mt" data-action="add-question">${icon('plus')} 問題を追加</button></aside><div class="stack"><section class="panel"><div class="row between mb"><h2>問題集の設定</h2><span class="tag">${esc(MODES[p.mode].name)}</span></div><div class="field"><label for="pack-title">問題集名</label><input id="pack-title" data-pfield="title" maxlength="80" value="${esc(p.title)}"></div><div class="form-grid"><div class="field"><label for="pack-seconds">${['clock','tower'].includes(p.mode)?'全体':'1問・1対戦'}の制限時間（秒）</label><input id="pack-seconds" data-setting="seconds" type="number" min="${p.mode==='code'?0:5}" max="600" value="${p.settings.seconds}"><small>${p.mode==='code'?'0で時間無制限。':'5〜600秒。'}</small></div>${['clock','tower','trolley'].includes(p.mode)?`<div class="field"><label for="pack-goal">${p.mode==='tower'?'目標階数':'クリアに必要な問題数'}</label><input id="pack-goal" data-setting="goal" type="number" min="1" max="30" value="${p.settings.goal}"></div>`:''}${p.mode==='tower'?`<div class="field"><label for="answer-seconds">1問あたりの制限時間（秒）</label><input id="answer-seconds" data-setting="answer_seconds" type="number" min="2" max="60" value="${p.settings.answer_seconds}"></div>`:''}${['bomber','clock','tower'].includes(p.mode)?`<div class="field"><label for="judge-mode">採点方法</label><select id="judge-mode" data-setting="judge"><option value="auto" ${p.settings.judge==='auto'?'selected':''}>正解・別解と照合して自動判定</option><option value="manual" ${p.settings.judge==='manual'?'selected':''}>司会者が○／×を判定</option></select><small>司会者判定では、判定待ちの間は時計を止めます。</small></div>`:''}</div><button class="small ghost" data-action="rules" data-mode="${p.mode}">このゲームのルールを見る</button></section><section class="panel"><div class="row between mb"><div><span class="caps">QUESTION ${String(app.qIndex+1).padStart(2,'0')}</span><h2 class="mt8">問題を編集</h2></div><div class="row gap8"><button class="small ghost" data-action="move-question" ${app.qIndex===0?'disabled':''}>↑ 順序を上へ</button><button class="small ghost" data-action="duplicate-question">複製</button><button class="small danger" data-action="delete-question" ${p.questions.length===1?'disabled':''}>削除</button></div></div><div class="field"><label for="q-prompt">問題文</label><textarea id="q-prompt" data-qfield="prompt" maxlength="1000" rows="3" placeholder="問題文を入力してください。">${esc(q.prompt)}</textarea></div><div class="form-grid"><div class="field"><label for="q-visual">大きく表示する文字・絵文字（任意）</label><input id="q-visual" data-qfield="visual" maxlength="80" value="${esc(q.visual||'')}" placeholder="例：△、🍎"></div><div class="field"><label for="q-image">問題画像（任意）</label><input id="q-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>PNG/JPEG/WebP/GIF。送信前に画像を縮小します。</small>${q.image?`<img class="editor-img mt8" src="${esc(q.image)}" alt="問題画像"><button class="small ghost mt8" data-action="remove-image">画像を削除</button>`:''}</div></div>${qfields(p,q)}<div class="field"><label for="q-explanation">解説（任意）</label><textarea id="q-explanation" data-qfield="explanation" rows="3" maxlength="2000" placeholder="答え合わせで表示する補足。">${esc(q.explanation||'')}</textarea></div></section><div class="notice">保存した問題集は司会者だけが編集できます。開設済みルームの問題は自動では変わりません。更新後はルームの待機室で問題集を選び直してください。</div></div></div></main>`);}
async function saveEditor(){for(const q of app.editor.questions){if(q.groups)q.groups=q.groups.map(g=>g.map(x=>x.trim()).filter(Boolean)).filter(g=>g.length);if(q.answers)q.answers=q.answers.map(x=>x.trim()).filter(Boolean);if(q.options){while(q.options.length&&!q.options.at(-1).trim())q.options.pop();q.options=q.options.map(x=>x.trim());}}const saved=await api('/packs','POST',app.editor);app.editor=saved;app.dirty=false;toast('問題集をこのブラウザに保存しました。');renderEditor();}

function userName(id){return app.room?.players.find(p=>p.id===id)?.name||'待機中';}
function scoreboard(s){return `<div class="scoreboard"><div class="scorebox"><small>TEAM A</small><strong>${s.scores.A}</strong></div><div class="scorebox b"><small>TEAM B</small><strong>${s.scores.B}</strong></div></div>`;}
function roster(team,compact=false){const s=app.room,players=s.players.filter(p=>p.team===team);return `<section class="roster ${team==='B'?'b':''} ${compact?'roster-small':''}"><div class="roster-title"><strong>TEAM ${team}</strong><span class="tiny muted">${players.length} / 6</span></div>${players.map((p,i)=>`<div class="player-row ${s.active_players.includes(p.id)?'current':''} ${s.eliminated.includes(p.id)?'eliminated':''}"><span class="avatar ${p.online?'':'offline'} ${s.active_players.includes(p.id)?'active':''}">${i+1}</span><div class="player-name">${esc(p.name)}${p.id===s.self_id?' <span class="tag">あなた</span>':''}<small>${p.online?'接続中':'未接続・再接続待ち'}</small></div>${app.role==='host'&&s.status==='lobby'?`<button title="順番をひとつ前へ" class="icon-btn small" data-action="reorder" data-id="${esc(p.id)}">↑</button><button title="チームを移動" class="icon-btn small" data-action="move-player" data-id="${esc(p.id)}" data-team="${team==='A'?'B':'A'}">↔</button><button title="参加者を外す" class="icon-btn small" data-action="remove-player" data-id="${esc(p.id)}">×</button>`:''}</div>`).join('')||'<div class="empty-roster tiny muted center">参加者を待っています</div>'}</section>`;}
function sharePanel(){const url=appURL('/join/'+app.code);return `<section class="panel share-panel"><span class="caps">INVITE YOUR TEAM</span><h3 class="mt8">参加用URLを共有</h3><div class="share-code">${esc(app.code)}</div><input class="share-url" readonly value="${esc(url)}" aria-label="回答者URL"><button class="wide small primary" data-action="copy-join">${icon('copy')} 回答者URLをコピー</button><a class="button wide small mt8" target="_blank" rel="noopener" href="#/screen/${app.code}">共有スクリーンを開く ↗</a><p class="tiny muted mt">共有するのは回答者URLだけ。開催中はこのタブを前面に表示し、画面ロックを避けてください。</p></section>`;}
function hostControls(){const s=app.room;return `<section class="panel controls-panel"><div class="row between mb"><span class="caps">HOST CONTROLS</span><span class="tag">司会者専用</span></div><div class="controls">${s.status==='lobby'?`<label for="start-team">${s.mode==='duel'?'両チームで対戦します':'挑戦するチーム'}</label>${s.mode!=='duel'?'<select id="start-team"><option value="A">チームA</option><option value="B">チームB</option></select>':''}<button class="primary wide" data-action="start" ${!app.connected?'disabled':''}>${icon('play')} ゲームを開始</button><div class="rule-line"></div><label for="switch-pack">このルームで遊ぶ問題集</label><select id="switch-pack">${app.packs.map(p=>`<option value="${esc(p.id)}">${esc(MODES[p.mode].name)} / ${esc(p.title)}</option>`).join('')}</select><button class="small" data-action="switch-pack">問題集を切り替える</button><button class="small ghost" data-action="clear-scores">累計スコアを0にする</button>`:''}${s.status==='playing'?`<button class="wide" data-action="pause">Ⅱ 一時停止</button>${s.deadline?'<button class="small ghost" data-action="extend">全体の時間を10秒延長</button>':''}`:''}${s.status==='paused'?'<button class="primary wide" data-action="resume">▶ ゲームを再開</button>':''}${s.status==='between'?'<button class="primary wide" data-action="next">次の問題・対戦へ →</button>':''}${s.mode==='trolley'&&s.status==='playing'?'<div class="notice tiny">全員一致で自動確定。意見が分かれたら司会者が確定できます。</div><div class="row"><button data-action="trolley" data-value="0">左を確定</button><button data-action="trolley" data-value="1">右を確定</button></div>':''}${s.status!=='lobby'?'<button class="small ghost" data-action="reset">待機室へ戻る</button>':''}${['playing','paused','judging'].includes(s.status)?'<button class="small danger" data-action="finish">このゲームを終了</button>':''}<button class="small ghost" data-action="sound">${app.sound?'♪ 効果音：オン':'♪ 効果音：オフ'}</button><a class="button small ghost" href="#/host">スタジオへ戻る</a></div></section>`;}
function privatePanel(){const s=app.room,p=s.pending,q=s.private_question;if(!q)return '';return `<section class="host-private"><label>鍵 / 司会者だけに見える情報</label><p>${esc(s.solution)}</p>${p?`<div class="rule-line"></div><label>${esc(userName(p.player))}さんの解答</label><div class="judge-answer">${esc(p.answer)}</div><div class="tiny">登録済み正解との照合：${p.proposed?'一致':'不一致'}。判定中は時計が止まっています。</div>${s.mode==='bomber'?`<select id="judge-group"><option value="">該当する正解を選択</option>${q.groups.map((g,i)=>`<option value="${i}" ${p.group===i?'selected':''}>${esc(g[0])}</option>`).join('')}</select>`:''}<div class="row mt8"><button class="primary" data-action="judge" data-correct="true">○ 正解</button><button class="danger" data-action="judge" data-correct="false">× 不正解</button></div>`:''}${q.explanation?`<details><summary>解説を確認</summary><p class="mt8">${esc(q.explanation)}</p></details>`:''}</section>`;}
function timer(s){return `<div class="timer"><label>${s.mode==='tower'?'TOTAL TIME':'TIME LEFT'}</label><strong id="main-timer">--</strong><span class="tiny muted"> 秒</span></div>`;}
function available(){const s=app.room;return app.role==='player'&&app.connected&&s.status==='playing'&&s.active_players.includes(s.self_id)&&!s.attempts.includes(s.self_id);}
function answerForm(){const s=app.room;if(app.role!=='player')return '';if(s.status==='judging')return `<div class="spectator-note">${s.self_id===s.pending_player?'解答を送信しました。司会者が判定しています。':'司会者が判定しています。'}${s.own_pending?'<br>あなたの解答：'+esc(s.own_pending):''}</div>`;if(!available())return `<div class="spectator-note">${!app.connected?'通信を再接続しています。':s.attempts.includes(s.self_id)?'回答済みです。対戦結果を待ちましょう。':s.status==='paused'?'司会者が一時停止しています。':'いまは '+esc(s.active_players.map(userName).join('・'))+' さんの順番です。'}</div>`;return `<form id="answer-form" class="answer-row"><input id="answer-input" autocomplete="off" maxlength="120" aria-label="あなたの解答" placeholder="答えを入力" value="${esc(app.draftPhase===s.phase_id?app.draft:'')}" required><button class="primary" type="submit">送信 ${icon('arrow')}</button></form><p class="tiny muted center mt8">${s.mode==='duel'?'この問題は1回だけ回答できます。':'Enterキーでも送信できます。'}</p>`;}
function lastFeedback(){const f=app.room.last;if(!f)return '';return `<div class="feedback ${f.correct?'':'wrong'}">${f.correct?'○':'×'} ${esc(f.message)}${f.answer?'　「'+esc(f.answer)+'」':''}</div>`;}
function questionVisual(q){return `${q.image?`<img class="question-image" src="${esc(q.image)}" alt="クイズの問題画像">`:''}${q.visual?`<div class="visual">${esc(q.visual)}</div>`:''}`;}
function choiceView(s){const opts=s.question?.options||[];if(s.mode==='code')return `<div class="wires">${opts.map((o,i)=>{const cut=s.cut.includes(i);const danger=cut&&s.last?.correct===false&&s.last?.answer===o;return `<button class="wire ${cut?'cut':''} ${danger?'danger-cut':''}" data-action="choice" data-value="${i}" ${!available()||cut?'disabled':''}><span class="wire-no">${cut?'✓':String(i+1).padStart(2,'0')}</span><span>${esc(o)}</span></button>`;}).join('')}</div><div class="progress-numbers">解除済み <strong>${s.cut.length-(s.last?.correct===false?1:0)}</strong> / 10</div>`;
 return `<div class="routes">${opts.map((o,i)=>`<button class="route ${s.votes[s.self_id]===i?'selected':''}" data-action="choice" data-value="${i}" ${!available()?'disabled':''}><span>${i===0?'←':'→'} ${esc(o)}</span><small>${Object.values(s.votes).filter(v=>v===i).length}人が選択${s.votes[s.self_id]===i?' · あなたの選択':''}</small></button>`).join('')}</div><div class="path-track">${Array.from({length:s.settings.goal},(_,i)=>`${i?'<i class="path-edge"></i>':''}<span class="path-node ${i<s.progress?'done':''}">${i<s.progress?'✓':i+1}</span>`).join('')}</div><p class="tiny muted center mt8">${app.role==='player'?'全員一致で確定。確定するまでは選び直せます。':'全員一致で自動確定します。'}</p>`;}
function stage(){const s=app.room,m=s.mode,q=s.question||{};const finished=['between','finished'].includes(s.status);if(finished)return `<section class="stage"><div class="stage-top"><div><span class="caps">${s.status==='finished'?'STAGE RESULT':'ANSWER CHECK'}</span><div class="tiny muted">${esc(MODES[m].name)}</div></div>${scoreboard(s)}</div><div class="result-box"><div class="result-mark">${s.last?.correct===false?'×':'✓'}</div><h2>${esc(s.result)}</h2>${m==='tower'?`<p class="muted">終了時 ${s.floor}階 ／ 最高 ${s.best_floor}階</p>`:''}<p class="muted">今回の獲得点：A ${s.stage_scores.A}点 / B ${s.stage_scores.B}点</p>${s.solution?`<div class="solution"><label>${m==='code'?'避けるべきハズレ':'正解'}</label><p>${esc(s.solution)}</p>${s.explanation?'<p class="tiny muted mt8">'+esc(s.explanation)+'</p>':''}</div>`:''}${app.role!=='host'?'<div class="spectator-note">司会者が次のゲームを準備するまでお待ちください。</div>':''}</div>${lastFeedback()}</section>`;
 const turnNames=s.active_players.map(userName).join('・');
 let inner=`<div class="question">${esc(q.prompt)}</div>${questionVisual(q)}`;
 if(m==='bomber')inner+=`<div class="answer-slots">${Array.from({length:5},(_,i)=>`<div class="answer-slot ${s.accepted[i]?'filled':i===s.accepted.length?'now':''}"><small>ANSWER ${i+1}</small><strong>${s.accepted[i]?esc(s.accepted[i].answer):'？'}</strong></div>`).join('')}</div>`;
 if(m==='clock')inner+=`<div class="progress-numbers">CLEAR <strong>${s.correct_total}</strong> / ${s.settings.goal}</div>`;
 if(m==='duel')inner=`<div class="duel-board">${s.active_players.map((pid,i)=>`${i?'<span class="vs">VS</span>':''}<div class="contender ${i?'b':''}"><span class="caps">TEAM ${i?'B':'A'}</span><h3>${esc(userName(pid))}</h3><span class="tiny muted">${s.attempts.includes(pid)?'回答済み':'解答権あり'}</span></div>`).join('')}</div>`+inner;
 if(m==='tower')inner=`<div class="tower-layout"><div>${inner}<div class="center muted tiny">この問題は残り <strong id="question-timer">--</strong> 秒</div></div><aside><div class="tower">${Array.from({length:s.settings.goal},(_,i)=>s.settings.goal-i).map(f=>`<div class="floor ${f<=s.floor?'lit':''} ${f===s.floor?'current-floor':''}">${f} F</div>`).join('')}</div><div class="tower-meta">${s.floor} / ${s.settings.goal} F</div></aside></div>`;
 if(['code','trolley'].includes(m))inner+=choiceView(s);
 else inner+=`<div class="turn-label">${app.role==='player'&&s.active_players.includes(s.self_id)?'あなたの出番です！':esc(turnNames)+' さんの出番'}</div>${answerForm()}`;
 return `<section class="stage"><div class="stage-top"><div><span class="caps">${esc(MODES[m].en)}</span><div class="row gap8 mt8"><span class="tag">${esc(STATUS[s.status])}</span><span class="tiny muted">${m==='duel'?'対戦':m==='tower'?'出題':'問題'} ${s.index+1}</span></div></div>${timer(s)}</div>${s.status==='paused'?`<div class="notice warn">${esc(s.result)}</div>`:''}${s.status==='judging'?'<div class="notice">司会者が判定中です。タイマーは止まっています。</div>':''}${inner}${lastFeedback()}</section>`;
}
function renderRoom(){if(!app.room)return;const s=app.room;const focused=document.activeElement?.id;const selection=document.activeElement?.selectionStart;const roleLabel=app.role==='host'?'司会者専用画面':app.role==='screen'?'会場用・共有スクリーン':'回答者画面';
 let main;if(s.status==='lobby')main=`<section class="panel room-banner"><span class="caps">WAITING ROOM</span><h2>${esc(s.title)}</h2><p class="muted">${esc(MODES[s.mode].desc)}</p><div class="lobby-instructions">${app.role==='host'?'参加者がそろったら、挑戦するチームを選んでスタート。回答順は名簿の上からです。':app.role==='screen'?'参加用URLまたはルームコードを開いて、回答者として入室してください。':'入室できました。司会者が開始するまで、この画面でお待ちください。'}</div><div class="row between"><span class="pill teal">ルーム ${esc(s.code)}</span><button class="small ghost" data-action="rules" data-mode="${s.mode}">ルールを確認 →</button></div></section><div class="rosters">${roster('A')}${roster('B')}</div>`;else main=stage();
 let side='';if(app.role==='host')side=sharePanel()+hostControls()+(s.status!=='lobby'?privatePanel():'');else if(app.role==='player')side=`<section class="panel"><span class="caps">YOUR PLAYER</span><h3 class="mt8">${esc(userName(s.self_id))}</h3><p class="tiny muted mt8">${esc(MODES[s.mode].name)}<br>タブを閉じずに参加してください。</p><button class="small ghost wide mt" data-action="sound">${app.sound?'♪ 効果音：オン':'♪ 効果音：オフ'}</button></section>`;
 if(app.role!=='screen'&&s.status!=='lobby')side+=roster('A',true)+roster('B',true);
 mount(`<main class="container"><div class="statusbar"><div><span class="caps">${esc(roleLabel)} / ${esc(s.code)}</span><h1>${esc(MODES[s.mode].name)}</h1></div>${scoreboard(s)}</div><div class="room-layout"><div>${main}</div>${side?'<aside class="room-sidebar">'+side+'</aside>':''}</div></main>`,roleLabel);
 updateTimers();if(focused==='answer-input'&&$('#answer-input')){$('#answer-input').focus({preventScroll:true});if(selection!==null)$('#answer-input').setSelectionRange(selection,selection);}
}
function updateTimers(){const s=app.room;if(app.view!=='room'||!s)return;const now=Date.now()/1000+app.offset;const el=$('#main-timer');if(el){const value=s.deadline?Math.max(0,s.deadline-now):(['paused','judging'].includes(s.status)?s.remaining:null);el.textContent=value===null||value===undefined?'∞':value.toFixed(1);el.parentElement.classList.toggle('low',value!==null&&value<10);}const qe=$('#question-timer');if(qe){const value=s.qdeadline?Math.max(0,s.qdeadline-now):s.question_remaining;qe.textContent=value===null||value===undefined?'--':value.toFixed(1);}}
setInterval(updateTimers,80);
let composing=false,delayedState=null;
function applyState(data){
 if(app.view!=='room'||data.code!==app.code||data.role!==app.role)return;
 if(composing&&app.room?.phase_id===data.phase_id){delayedState=data;return;}
 if(app.room&&data.revision<app.room.revision)return;
 app.offset=data.server_time-Date.now()/1000;
 if(app.draftPhase!==data.phase_id){app.draft='';app.draftPhase=data.phase_id;}
 app.room=data;
 if(data.last?.at&&data.last.at!==app.lastSound){app.lastSound=data.last.at;if(app.sound)beep(data.last.correct);}
 renderRoom();
}
transport.onstate=applyState;
transport.onstatus=connected=>{app.connected=connected;if(app.view==='room'&&app.room)renderRoom();};
transport.onerror=message=>toast(message);
document.addEventListener('compositionstart',()=>{composing=true;});
document.addEventListener('compositionend',()=>{composing=false;if(delayedState){const s=delayedState;delayedState=null;setTimeout(()=>applyState(s),0);}});
async function connectRoom(code,role){app.view='room';app.code=code;app.role=role;app.room=null;app.connected=false;mount('<main class="container"><div class="panel auth-wrap"><h2>ルームに接続しています…</h2><p>司会者の画面を開いたままにしてください。</p></div></main>');if(role==='host')app.packs=await api('/packs');const s=await api(`/rooms/${code}/state?role=${role}`);app.connected=true;applyState(s);}

async function control(command,extra={}){await api(`/rooms/${app.code}/control`,'POST',{command,...extra});}
async function sendAnswer(value){const phase=app.room.phase_id;await api(`/rooms/${app.code}/answer`,'POST',{value,phase_id:phase});app.draft='';const input=$('#answer-input');if(input)input.value='';}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('URLをコピーしました。');}catch{modal(`<h2>このURLをコピーしてください</h2><input id="copy-fallback" readonly value="${esc(text)}">`);setTimeout(()=>$('#copy-fallback')?.select(),50);}}
let audio;
function beep(correct=true){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=correct?700:200;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.22);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.22);}catch{}}
async function picture(file){if(!file)return;if(file.size>15000000)throw new Error('元画像は15MB以下にしてください。');if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type))throw new Error('PNG/JPEG/WebP/GIFを選択してください。');const url=URL.createObjectURL(file);try{const image=new Image();image.src=url;await image.decode();const scale=Math.min(1,1000/image.width,800/image.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.82);if(data.length>700000)data=canvas.toDataURL('image/jpeg',.5);if(data.length>700000)throw new Error('画像が大きすぎます。小さな画像を使用してください。');app.editor.questions[app.qIndex].image=data;dirty();renderEditor();}finally{URL.revokeObjectURL(url);}}
document.addEventListener('input',e=>{const el=e.target;if(el.id==='answer-input'){app.draft=el.value;app.draftPhase=app.room.phase_id;}if(app.view!=='editor')return;const p=app.editor,q=p.questions[app.qIndex];if(el.dataset.pfield){p[el.dataset.pfield]=el.value;dirty();}if(el.dataset.setting){p.settings[el.dataset.setting]=el.dataset.setting==='judge'?el.value:Number(el.value);dirty();}const field=el.dataset.qfield;if(field){if(field==='groups')q.groups=el.value.split('\n').map(s=>s.split('|').map(s=>s.trim()));else if(field==='answers')q.answers=el.value.split('|').map(s=>s.trim());else if(field==='options')q.options=el.value.split('\n');else if(['danger','correct'].includes(field))q[field]=Number(el.value);else q[field]=el.value;dirty();}});
document.addEventListener('change',e=>{if(e.target.id==='q-image')picture(e.target.files[0]).catch(err=>toast(err.message));});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.classList.contains('question-row'))e.target.click();});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target,button=form.querySelector('button[type=submit]');if(button)button.disabled=true;try{
 if(form.id==='join-code-form'){await navigate('/join/'+$('#join-code').value.trim().toUpperCase());}
 else if(form.id==='auth-form'){const result=await api('/'+app.authMode,'POST',{login:$('#login').value,password:$('#password').value});app.user=result.user;await navigate(app.returnPath);}
 else if(form.id==='join-form'){await api(`/rooms/${app.code}/join`,'POST',{name:$('#player-name').value,team:$('#player-team').value});await connectRoom(app.code,'player');}
 else if(form.id==='new-pack-form'){const mode=$('#new-mode').value,title=$('#new-title').value;const pack={title,mode,settings:{...app.meta.defaults[mode]},questions:[blankQuestion(mode)]};closeModal();openEditor(pack);dirty();}
 else if(form.id==='answer-form'){await sendAnswer($('#answer-input').value);}
 }catch(err){if(form.id==='auth-form'){$('#auth-error').textContent=err.message;$('#auth-error').classList.remove('hidden');}else toast(err.message);}finally{if(button)button.disabled=false;}});
document.addEventListener('click',async e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;try{
 switch(action){
 case 'auth':await navigate('/host');break;
 case 'host-home':await navigate('/host');break;
 case 'auth-tab':app.authMode=button.dataset.tab;auth();break;
 case 'close-modal':closeModal();break;
 case 'backup':{const text=await transport.exportBank();modal(`<h2>問題集の控え</h2><p class="muted">この内容をすべてコピーし、ご自身のメモなどに保存してください。正解が含まれるため回答者には共有しないでください。ダウンロードは不要です。</p><textarea id="backup-text" rows="10" readonly>${esc(text)}</textarea><button class="primary mt" data-action="copy-backup">内容をコピー</button>`);break;}
 case 'copy-backup':{const el=$('#backup-text');try{await navigator.clipboard.writeText(el.value);toast('問題集の内容をコピーしました。');}catch{el.select();toast('選択した内容をコピーしてください。');}break;}
 case 'restore':modal('<h2>問題集を復元</h2><p class="muted">控えた内容を貼り付けてください。既存の問題集は消さずに追加します。</p><textarea id="restore-text" rows="10" aria-label="問題集の控え"></textarea><button class="primary mt" data-action="restore-confirm">復元する</button>');break;
 case 'restore-confirm':{const n=await transport.importBank($('#restore-text').value);closeModal();await dashboard();toast(n+'個の問題集を追加しました。');break;}

 case 'rules':rules(button.dataset.mode);break;
 case 'logout':await api('/logout','POST',{});await navigate('/');break;
 case 'filter':app.filter=button.dataset.mode;renderDashboard();break;
 case 'new-pack':newPackModal();break;
 case 'edit-pack':openEditor(app.packs.find(p=>p.id===button.dataset.id));break;
 case 'duplicate-pack':{const p=JSON.parse(JSON.stringify(app.packs.find(p=>p.id===button.dataset.id)));delete p.id;p.title=(p.title+'（コピー）').slice(0,80);await api('/packs','POST',p);await dashboard();toast('問題集を複製しました。');break;}
 case 'delete-pack':if(confirm('この問題集を削除しますか？ 開設済みルームの問題は残ります。')){await api('/packs/'+button.dataset.id,'DELETE');await dashboard();}break;
 case 'create-room':{button.disabled=true;const room=await api('/rooms','POST',{pack_id:button.dataset.id});await navigate(room.host_path);break;}
 case 'save-pack':button.disabled=true;await saveEditor();break;
 case 'editor-back':if(!app.dirty||confirm('未保存の変更があります。保存せずに戻りますか？')){app.dirty=false;await dashboard();}break;
 case 'select-question':app.qIndex=Number(button.dataset.index);renderEditor();break;
 case 'add-question':app.editor.questions.push(blankQuestion(app.editor.mode));app.qIndex=app.editor.questions.length-1;dirty();renderEditor();break;
 case 'duplicate-question':app.editor.questions.splice(app.qIndex+1,0,JSON.parse(JSON.stringify(app.editor.questions[app.qIndex])));app.qIndex++;dirty();renderEditor();break;
 case 'delete-question':if(confirm('この問題を削除しますか？')){app.editor.questions.splice(app.qIndex,1);app.qIndex=Math.min(app.qIndex,app.editor.questions.length-1);dirty();renderEditor();}break;
 case 'move-question':{let a=app.editor.questions;[a[app.qIndex],a[app.qIndex-1]]=[a[app.qIndex-1],a[app.qIndex]];app.qIndex--;dirty();renderEditor();break;}
 case 'remove-image':app.editor.questions[app.qIndex].image='';dirty();renderEditor();break;
 case 'copy-join':await copyText(appURL('/join/'+app.code));break;
 case 'start':await control('start',{team:$('#start-team')?.value||'A'});break;
 case 'pause':case 'resume':case 'next':case 'extend':button.disabled=true;await control(action);break;
 case 'reset':if(confirm('現在のゲームを終了して待機室へ戻りますか？ 累計スコアと参加者は残ります。'))await control('reset');break;
 case 'finish':if(confirm('このゲームをここで終了しますか？'))await control('finish');break;
 case 'switch-pack':await control('switch_pack',{pack_id:$('#switch-pack').value});toast('問題集を切り替えました。参加URLは変わりません。');break;
 case 'clear-scores':if(confirm('両チームの累計スコアを0にしますか？'))await control('clear_scores');break;
 case 'move-player':await control('move_player',{player_id:button.dataset.id,team:button.dataset.team});break;
 case 'remove-player':if(confirm('この参加者をルームから外しますか？'))await control('remove_player',{player_id:button.dataset.id});break;
 case 'reorder':await control('reorder',{player_id:button.dataset.id});break;
 case 'judge':{const correct=button.dataset.correct==='true';const group=$('#judge-group')?.value;await control('judge',{correct,group:group!==undefined&&group!==''?Number(group):null});break;}
 case 'choice':button.disabled=true;await sendAnswer(Number(button.dataset.value));break;
 case 'trolley':if(confirm((button.dataset.value==='0'?'左':'右')+'を最終解答として確定しますか？'))await control('trolley',{value:Number(button.dataset.value)});break;
 case 'sound':app.sound=!app.sound;if(app.sound)beep();renderRoom();break;
 }
 }catch(err){toast(err.message);}finally{if(button.isConnected)button.disabled=false;}});
window.addEventListener('beforeunload',e=>{if(app.dirty||(app.role==='host'&&['playing','judging'].includes(app.room?.status))){e.preventDefault();e.returnValue='';}});
async function init(){try{await transport.init();app.meta=await api('/me');app.user=app.meta.user;const parts=location.hash.replace(/^#/, '').split('/').filter(Boolean);const targetRole=parts[1]?(parts[0]==='host'?'host':parts[0]==='screen'?'screen':parts[0]==='join'?'player':null):null;if(transport.role&&(transport.role!==targetRole||transport.code!==parts[1]?.toUpperCase()))await transport.close();if(parts[0]==='host'){if(!app.user){app.returnPath=location.hash.slice(1);auth();}else if(parts[1])await connectRoom(parts[1].toUpperCase(),'host');else await dashboard();}else if(parts[0]==='join'&&parts[1])await joinPage(parts[1].toUpperCase());else if(parts[0]==='screen'&&parts[1])await connectRoom(parts[1].toUpperCase(),'screen');else home();}catch(err){app.view='error';mount(`<main class="container"><div class="panel auth-wrap"><h2>画面を開けませんでした</h2><p class="muted mt">${esc(err.message)}</p><a class="button primary mt" href="#/">ホームへ戻る</a><p class="tiny muted mt">再読み込みはブラウザから行ってください。</p></div></main>`);}}

/* App extension. Runs in the same classic-script scope as the preserved v1 UI. */
const AI=globalThis.QuizAI,E=globalThis.QuizEngine;
STATUS.judging='判定中（時計停止）';
const legacyFields=qfields;
qfields=function(p,q){
 q.groups??=p.mode==='bomber'?[]:undefined;q.answers??=[];
 const ai=q.judging==='ai';
 let fields=legacyFields(p,q);
 if(ai){
  if(['code','trolley'].includes(p.mode)){const box=document.createElement('div');box.innerHTML=fields;box.querySelector('#q-key')?.closest('.field')?.remove();fields=box.innerHTML+'<div class="notice tiny">正解・ハズレの番号はAIが判断します。正解が一意に決まる問題と選択肢を作成してください。</div>';}
  else fields='';
 }
 return `<div class="field"><label for="q-judging">この問題の正誤判定</label><select id="q-judging" data-qfield="judging"><option value="list" ${!ai?'selected':''}>① 正解一覧を手入力して判定（従来どおり）</option><option value="ai" ${ai?'selected':''}>② AIが問題と条件から判定（一覧不要・無料）</option></select><small>問題ごとに切り替えられます。切り替えても入力済みの正解は編集画面内に残ります。</small></div>${fields}${ai?`<div class="notice mb">正解をすべて列挙する必要はありません。AIが知らない事柄・最新情報・曖昧な条件では誤判定の可能性があります。迷う回答やエラーは司会者の確認へ回します。</div><div class="field"><label for="q-ai-criteria">AIへの判定基準・補足（任意）</label><textarea id="q-ai-criteria" data-qfield="aiCriteria" maxlength="2000" rows="4" placeholder="例：日本の市の名前を1つ。実在する市だけを認める。区・町・村は不可。市の省略、漢字・かな・英語表記は同じ回答として扱う。">${esc(q.aiCriteria||'')}</textarea><small>未入力なら問題文を基準にします。対象の時点・範囲・認める略称・除外条件がある場合は明記してください。</small></div><div class="field"><label for="q-ai-context">画像の内容・判定に必要な資料（司会者専用）</label><textarea id="q-ai-context" data-qfield="aiContext" maxlength="2000" rows="3" placeholder="画像問題の例：写真は東京タワー。施設名を答える問題。">${esc(q.aiContext||'')}</textarea><small>このAIは画像を直接認識しません。画像がある場合は内容の説明が必須です。この欄と判定基準は回答者へ送信しません。</small></div><div class="panel" style="box-shadow:none"><div class="row between"><h3>この問題で判定を試す</h3><button type="button" class="small" data-ai-action="setup">AIを準備・設定</button></div><p class="tiny muted mt8">保存前でもテストできます。ゲームの得点には影響しません。選択式では1から始まる選択肢番号を入力してください。</p><div class="row mt8"><input id="ai-test-answer" maxlength="120" placeholder="試したい回答" aria-label="AI採点を試す回答"><button class="small primary" data-ai-action="test">判定を試す</button></div><div id="ai-test-result" class="notice mt8" role="status">未テスト</div></div>`:''}`;
};
const oldEditor=renderEditor;
renderEditor=function(){oldEditor();const label=$('label[for="judge-mode"]');if(label)label.textContent='正解一覧方式の採点設定（AI方式には影響しません）';};
const oldDash=renderDashboard;
renderDashboard=function(){oldDash();const el=$('.mode-tabs');el?.insertAdjacentHTML('beforebegin','<section class="notice mt"><div class="row between"><div><strong>問題別のAI判定に対応しました</strong><p class="tiny muted">各問題の編集画面で「正解一覧」か「AI」を選択できます。以前の問題集はそのまま使えます。</p></div><button class="small" data-ai-action="setup">無料AIを準備・設定</button></div></section>');};
const oldControls=hostControls;
hostControls=function(){return oldControls()+`<section class="panel"><h3>AI判定 / 司会者端末</h3><p class="tiny muted mt8" data-ai-status>${esc(AI.ready?'準備完了':AI.progress)}</p><button class="small wide mt8" data-ai-action="setup">AIを準備・設定</button><p class="tiny muted mt8">AI方式の問題では時計を止めて採点します。正解一覧方式はAIの準備不要です。</p></section>`;};
const oldPrivate=privatePanel;
privatePanel=function(){const s=app.room,p=s.pending,q=s.private_question;
 let text;
 if(p?.ai)text=`<section class="host-private"><label>司会者専用 / AI判定</label><div class="judge-answer">${esc(p.answer)}</div><p class="tiny">${p.aiStatus==='running'?'AIが判定しています。時計は停止中です。':p.aiStatus==='review'?'AIでは確定できません。下のボタンで判定してください。':'AI判定を開始します。'}</p>${p.aiResult?`<div class="notice mt8">${esc(p.aiResult.reason)}</div>`:''}<div class="row mt8"><button class="primary" data-ai-action="decide" data-id="${esc(p.id)}" data-verdict="correct">○ 正解にする</button><button class="danger" data-ai-action="decide" data-id="${esc(p.id)}" data-verdict="incorrect">× 不正解にする</button>${s.mode==='bomber'?`<button data-ai-action="decide" data-id="${esc(p.id)}" data-verdict="duplicate">重複</button>`:''}</div><button class="small mt8" data-ai-action="retry">AIで再判定</button><details class="mt8"><summary>判定基準を確認</summary><p>${esc(q.aiCriteria||q.prompt)}</p><p>${esc(q.aiContext||'')}</p></details></section>`;
 else text=oldPrivate();
 const h=s.aiHistory||[];
 if(h.length||s.aiCanUndo)text+=`<section class="host-private"><label>直近のAI・司会者判定</label>${h.slice(-3).reverse().map(x=>`<p><strong>${esc(x.answer)}</strong>：${esc({correct:'正解',incorrect:'不正解',duplicate:'重複',uncertain:'要確認'}[x.verdict]||x.verdict)}<br><span class="tiny muted">${esc(x.reason)}</span></p>`).join('')}${s.aiCanUndo?'<button class="small mt8" data-ai-action="undo">直前の判定を取り消して再判定</button><p class="tiny muted">次の回答・時間切れ等が進むと取り消せなくなります。</p>':''}</section>`;
 return text;
};
const oldAvailable=available;
available=function(){const s=app.room;return !!s&&s.mode==='duel'&&s.judging==='ai'&&s.status==='judging'?app.connected&&s.active_players.includes(s.self_id)&&!s.attempts.includes(s.self_id):oldAvailable();};
const oldAnswerForm=answerForm;
answerForm=function(){const s=app.room;if(app.role==='player'&&s.mode==='duel'&&s.judging==='ai'&&s.status==='judging'&&available())return `<form id="answer-form" class="answer-row"><input id="answer-input" autocomplete="off" maxlength="120" aria-label="あなたの解答" placeholder="答えを入力" value="${esc(app.draftPhase===s.phase_id?app.draft:'')}" required><button class="primary" type="submit">送信</button></form><p class="tiny muted center">先着順は司会者の受信順で保持します。相手のAI判定中も1回だけ送信できます。</p>`;return oldAnswerForm().replaceAll('司会者が判定しています。',s.judging==='ai'?'AI・司会者が判定しています。':'司会者が判定しています。');};
const oldStage=stage;
stage=function(){return oldStage().replace('司会者が判定中です。タイマーは止まっています。',app.room.judging==='ai'?'AI判定中です。タイマーは止まっています。必要な場合は司会者が確認します。':'司会者が判定中です。タイマーは止まっています。');};
const oldFooter=footer;
footer=function(){return oldFooter().replace('</footer>','<br><span>v2.0 · 問題別AI判定</span></footer>');};
function setupAI(){modal(`<h2>無料AIを準備</h2><p class="muted">司会者の端末内だけで動かします。APIキー・サブスクリプション・有料サービスは使用しません。</p><div class="notice warn mt">初回は大容量のAIモデルをブラウザが読み込みます。別アプリのインストールは不要ですが、数GB規模の通信・保存容量・GPUメモリを使う場合があります。回線のデータ通信料にはご注意ください。回答者端末でのモデル読み込みは不要です。</div><div class="field mt"><label for="ai-size">モデル</label><select id="ai-size"><option value="3B">標準：Qwen 2.5 3B</option><option value="1.5B">軽量：Qwen 2.5 1.5B（知識・精度は限定的）</option><option value="7B">大容量：Qwen 2.5 7B（より多くのメモリが必要）</option></select></div><label class="row"><input id="ai-consent" type="checkbox" style="width:auto">モデルの読み込み・保存と通信量を確認しました</label><div class="row"><button class="primary" data-ai-action="prepare">AIを準備する</button><button data-ai-action="stop">AIの動作を停止</button></div><div id="ai-progress" class="notice mt" role="status">${esc(AI.progress)}</div><p class="tiny muted mt">WebGPU対応のPCブラウザを推奨します。端末・GPUによって動作しません。AIは誤ることがあり、インターネット検索や画像認識は行いません。重要な判定は司会者も確認してください。停止してもモデルのブラウザキャッシュは残ります。</p>`);updateAIUI();}
function updateAIUI(){const p=$('#ai-progress');if(p)p.textContent=AI.progress;document.querySelectorAll('[data-ai-status]').forEach(x=>x.textContent=AI.ready?'準備完了':AI.progress);const button=$('[data-ai-action="prepare"]');if(button)button.disabled=AI.loading||AI.busy;}
AI.onchange=updateAIUI;
document.addEventListener('change',e=>{if(e.target.id==='q-judging'&&app.view==='editor'){const q=app.editor.questions[app.qIndex];q.judging=e.target.value;if(q.judging==='list'&&['code','trolley'].includes(app.editor.mode)){const k=app.editor.mode==='code'?'danger':'correct';if(!Number.isInteger(q[k]))q[k]=0;}dirty();renderEditor();}});
let activeAI=null;
function validJob(job){return transport.role==='host'&&transport.room===job.room&&job.room.state.pending?.id===job.id&&job.room.state.status==='judging';}
function kickAI(){
 if(activeAI){if(!validJob(activeAI))activeAI.controller.abort();return;}
 const r=transport.room,p=r?.state.pending;
 if(transport.role!=='host'||!p?.ai||p.aiStatus!=='queued')return;
 const job={room:r,id:p.id,controller:new AbortController()};activeAI=job;p.aiStatus='running';
 (async()=>{
  try{
   await transport.serial(async()=>{if(validJob(job))await transport.changed();});
   if(!validJob(job))return;
   const result=await AI.judge(AI.payload(r),job.controller.signal);
   await transport.serial(async()=>{if(validJob(job)){E.resolveAI(r,job.id,result);await transport.changed();}});
  }catch(e){await transport.serial(async()=>{if(validJob(job)){E.resolveAI(r,job.id,{verdict:'uncertain',reason:e.message||'AI判定に失敗しました。'});await transport.changed();}}).catch(err=>toast(err.message));}
  finally{if(activeAI===job)activeAI=null;kickAI();}
 })();
}
const oldBroadcast=transport.broadcast.bind(transport);
transport.broadcast=function(){oldBroadcast();kickAI();};
const oldHost=transport.host.bind(transport);
transport.host=async function(code){const wasHosting=this.role==='host'&&this.code===code;await oldHost(code);const p=this.room?.state.pending;if(!wasHosting&&p?.ai&&p.aiStatus==='running'){p.id=E.id();p.aiStatus='review';p.aiResult={reason:'再接続しました。司会者が再判定するかAIで再判定してください。'};await this.changed();}};
const oldClose=transport.close.bind(transport);
transport.close=async function(){activeAI?.controller.abort();return oldClose();};
const oldAPI=transport.api.bind(transport);
transport.api=async function(path,method,data){if(path.includes('/control')&&data?.command==='start'&&this.role==='host'&&this.room.pack.questions.some(q=>q.judging==='ai')&&!AI.ready)throw new Error('この問題集にはAI判定があります。「AIを準備・設定」で準備を完了してから開始してください。');return oldAPI(path,method,data);};
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-ai-action]');if(!b||b.disabled)return;
 const action=b.dataset.aiAction;
 try{
  if(action==='setup'){setupAI();return;}
  if(action==='prepare'){if(!$('#ai-consent')?.checked)throw new Error('モデルの読み込み・通信量の確認欄にチェックを入れてください。');const size=$('#ai-size').value;await AI.prepare(size);toast('AIの準備が完了しました。');return;}
  if(action==='stop'){AI.stop();return;}
  if(action==='test'){
   if(!AI.ready){setupAI();toast('先にAIを準備してください。');return;}
   if(activeAI||AI.busy)throw new Error('ゲームの採点中はテストできません。');
   const answer=$('#ai-test-answer').value.trim();if(!answer)throw new Error('テストする回答を入力してください。');
   const pack=JSON.parse(JSON.stringify(app.editor)),question=pack.questions[app.qIndex],mode=pack.mode;
   let value=-1;if(['code','trolley'].includes(mode)){value=Number(answer)-1;if(!Number.isInteger(value)||value<0||value>=question.options.length)throw new Error('選択肢番号を1から入力してください。');}
   const r={pack,state:{index:app.qIndex,pending:{answer:value>=0?question.options[value]:answer,value},accepted:[]}};
   const target=$('#ai-test-result');target.textContent='AIがテスト判定しています…';b.disabled=true;
   try{const x=await AI.judge(AI.payload(r));if(target.isConnected)target.textContent=({correct:'○ 正解',incorrect:'× 不正解',duplicate:'重複',uncertain:'要確認'}[x.verdict])+'：'+x.reason;}catch(err){if(target.isConnected)target.textContent='要確認：'+err.message;}return;
  }
  if(app.role!=='host')throw new Error('司会者の画面から操作してください。');
  b.disabled=true;
  if(action==='decide')await control('ai_resolve',{id:b.dataset.id,result:{verdict:b.dataset.verdict,canonical:app.room.pending?.answer||'',reason:'司会者が確認して判定'}});
  else if(action==='retry'){if(!AI.ready){setupAI();return;}await control('ai_retry');}
  else if(action==='undo')await control('ai_undo');
 }catch(err){toast(err.message);}finally{if(b.isConnected)b.disabled=false;updateAIUI();}
});
